apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorized-user
  namespace: secrets-research
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unauthorized-user
  namespace: secrets-research
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: secrets-research
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["research-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
  namespace: secrets-research
subjects:
  - kind: ServiceAccount
    name: authorized-user
    namespace: secrets-research
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
