name: Sealed Secrets Experiment

on:
  push:
    paths:
      - '.github/workflows/sealed-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1.12.0

      - name: Install Sealed Secrets
        run: |
          VERSION=0.27.3
          BASE=https://github.com/bitnami/sealed-secrets/releases/download/v${VERSION}
          kubectl apply -f "$BASE/controller.yaml"
          curl -fsSL "$BASE/kubeseal-${VERSION}-linux-amd64.tar.gz" | tar xz
          sudo install kubeseal /usr/local/bin/kubeseal
          kubectl rollout status deployment/sealed-secrets-controller -n kube-system --timeout=180s

      - name: Encrypt and deploy secret
        run: |
          kubectl create namespace secrets-research
          START=$(date +%s)
          kubectl create secret generic research-secret \
            -n secrets-research \
            --from-literal=password=synthetic-test-password \
            --dry-run=client -o json | \
            kubeseal --format yaml > sealed-secret.yaml
          kubectl apply -f sealed-secret.yaml
          kubectl wait --for=condition=Synced sealedsecret/research-secret -n secrets-research --timeout=120s
          echo "Sealing and deployment time: $(($(date +%s)-START)) seconds"
          cat sealed-secret.yaml
          if grep -q 'synthetic-test-password' sealed-secret.yaml; then
            exit 1
          fi
          echo "PASS: Plaintext absent from sealed manifest"

      - name: Deploy application
        run: |
          START=$(date +%s)
          kubectl create deployment research-app --image=nginx:alpine -n secrets-research
          kubectl set env deployment/research-app --from=secret/research-secret -n secrets-research
          kubectl rollout status deployment/research-app -n secrets-research --timeout=180s
          echo "Application deployment time: $(($(date +%s)-START)) seconds"
          kubectl get pods -n secrets-research

      - name: Verify credential
        run: |
          kubectl exec deployment/research-app -n secrets-research -- \
            sh -c 'test "$password" = "synthetic-test-password"'
          echo "PASS: Application received decrypted credential"

      - name: Verify access controls
        run: |
          kubectl apply -f security-rbac.yaml
          test "$(kubectl auth can-i get secret/research-secret -n secrets-research --as=system:serviceaccount:secrets-research:authorized-user)" = yes
          echo "PASS: Authorized access permitted"
          test "$(kubectl auth can-i get secret/research-secret -n secrets-research --as=system:serviceaccount:secrets-research:unauthorized-user || true)" = no
          echo "PASS: Unauthorized access denied"
